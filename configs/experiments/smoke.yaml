name: smoke
stage: smoke
description: End-to-end smoke run on a tiny committed fixture; no downloads and no GPU.
dataset:
  name: smoke
  loader: local_csv
  path: tests/fixtures/smoke_series.csv
  series_id: smoke_series
  timestamp_column: timestamp
  value_column: value
  split_manifest: tests/fixtures/smoke_split_manifest.json
# Models are declared by registry key; entrypoints come from configs/models.yaml,
# so `make smoke` constructs the real `naive` floor through the same
# license-gated registry path as the backtests.
models:
  - naive
split:
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2
  context_length: 20
  horizon: 4
  stride: 4
  min_train_size: 5
output_dir: results
