# Rolling-origin backtest on the primary electricity-demand dataset.
#
# Every family is evaluated on the same frozen windows: context_length values
# end at the forecast origin and the horizon begins there, so no window reads a
# value at or after its target block. `make backtest` runs this config after
# `python -m tsbench.data.build_catalog --materialize` has fetched the data.
#
# BOUNDED SUBSET. All 24 frozen evaluation series are used, but the forecast
# origins are sampled every 240 steps (10 days) instead of the manifest's
# 24-step stride. That yields ~21 origins per series per horizon and keeps a
# five-family run inside a single sitting; the split boundaries are unchanged
# and no window reads its target block. The full-stride sweep is a follow-up.
name: backtest_h192
stage: backtest
description: >-
  Rolling-origin backtest over 24 electricity series at the 192h horizon
  (primary horizon sweep 24/48/96/192), bounded as described in backtest.yaml.

dataset:
  name: electricity_hourly
  loader: monash_tsf
  max_series: null
  split_manifest: data/manifests/electricity_hourly_split_manifest.json

split:
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2
  context_length: 168
  horizon: 192
  stride: 240
  min_train_size: 168

# Bounded-subset provenance, recorded verbatim in run.json.
subset:
  series: all 24 frozen evaluation series (T1..T308, evenly spaced)
  origin_stride: 240
  origins_per_series_per_horizon: "21-22"
  note: >-
    First real results. The full-stride (24-step) sweep is a follow-up; the
    frozen split boundaries and leakage guarantees are identical.

# tracemalloc peak tracking makes statsforecast's AutoARIMA ~3.5x slower
# (measured 41s vs 12s for one 22-window series), so the bounded first-results
# run opts out: `peak_mem_mb` is empty here and memory telemetry is a follow-up.
# Latency and training wall-clock are still measured. Set `true` to pay for it.
track_memory: false

# Models are declared by registry key; entrypoints come from configs/models.yaml.
# All five local CPU families run here: the two reference floors, classical
# ETS/ARIMA, and the gradient-boosted lag model. `make smoke` uses the tiny
# fixture instead. `auto_arima` runs statsforecast's default non-seasonal search:
# a seasonal (m=24) search is orders of magnitude slower per window and pushes a
# single run past a day of CPU, so the daily seasonal structure is carried by
# `auto_ets`, `seasonal_naive`, and the XGBoost lag features instead. The engine
# that ran is recorded per row in the run's `run.json`/model info.
models:
  - naive
  - seasonal_naive
  - auto_ets
  - auto_arima
  - xgboost_lags

model_configs:
  seasonal_naive:
    kwargs:
      season_length: 24
  auto_ets:
    kwargs:
      season_length: 24
  xgboost_lags:
    kwargs:
      lags: [1, 2, 3, 24, 25, 48]
      use_calendar: true

# `season_length` is the metric scale (seasonal MASE denominator); per-model
# seasonal structure is set in `model_configs` above.
season_length: 24
seed: 20240919
output_dir: results
